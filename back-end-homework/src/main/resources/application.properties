spring.application.name=back-end-homework


# 서브 포트
server.port=81

# 로그 컬러 출력
spring.output.ansi.enabled=ALWAYS

# 로그 출력 패턴
logging.pattern.console=%clr(%-5level) %clr(%logger{40}.%M\\(\\)){cyan}: %msg %n
logging.level.root=INFO

#파일 업로드
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

#OpenAi api key 
my_openai_api_key = $(OPENAI_API_KEY)

# PostgreSQL and MyBatis
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
mybatis.config-location=classpath:/mybatis/mybatis_config.xml
mybatis.mapper-locations=classpath:/mybatis/mapper/*.xml
