# 프로젝트 명
spring.application.name=backend

# 내장 웹 서버가 HTTP 요청을 받는 포트
server.port=80

# 로그 컬러 출력
spring.output.ansi.enabled=ALWAYS

# 로그 출력 패턴
logging.pattern.console=%clr(%-5level) %clr(%logger{40}.%M\\(\\)){cyan}: %msg %n
logging.level.root=INFO

# multipart 업로드: 파일 하나는 최대 10MB, 파일과 폼 데이터를 포함한 요청 전체는 최대 15MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# OpenAI API 키: 아래는 환경 변수 참조 예시이며 현재는 주석 처리되어 있다.
# openai_api_key=${OPENAI_API_KEY}

#DataSource(Database) 연결 설정
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres


#MyBatis 설정
mybatis.config-location=classpath:/mybatis/mybatis_config.xml
mybatis.mapper-locations=classpath:/mybatis/mapper/*.xml


# JWT HMAC 서명용 비밀키 설정. @Value로 주입되며 실제 운영 키는 외부 설정으로 관리한다.
jwt.secret.key=${JWT_SECRET_KEY}
